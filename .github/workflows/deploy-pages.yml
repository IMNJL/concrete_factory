name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - frontend
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          rm -rf dist
          mkdir -p dist

          # Disable Jekyll processing
          touch dist/.nojekyll

          # Frontend (HTML/CSS/JS)
          cp -R frontend/* dist/

          # Shared static assets
          mkdir -p dist/assets
          cp -R assets/* dist/assets/

      - name: Generate public runtime config (no secrets)
        env:
          # Set one of these in GitHub:
          # - Repository variable: PUBLIC_API_BASE_URL
          # - Or repository secret: PUBLIC_API_BASE_URL
          # Example value: https://your-backend.example.com
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          PUBLIC_API_BASE_URL_SECRET: ${{ secrets.PUBLIC_API_BASE_URL }}
        run: |
          set -euo pipefail
          export API_BASE_URL="${PUBLIC_API_BASE_URL_SECRET:-$PUBLIC_API_BASE_URL}"
          python3 -c "import os, json; api=(os.getenv('API_BASE_URL') or os.getenv('PUBLIC_API_BASE_URL') or '').strip(); print('window.__APP_CONFIG__ = ' + json.dumps({'apiBaseUrl': api}) + ';')" > dist/config.js

      - name: Configure Pages
        id: configure_pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Hint (enable Pages)
        if: steps.configure_pages.outcome != 'success'
        run: |
          echo "GitHub Pages is not enabled or Actions lacks permission to access it."
          echo "Enable it in: Settings -> Pages -> Source: GitHub Actions."
          echo "Also check: Settings -> Actions -> General -> Workflow permissions -> Read and write permissions."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4