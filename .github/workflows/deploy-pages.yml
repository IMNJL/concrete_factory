name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - frontend
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          rm -rf dist
          mkdir -p dist

          # Disable Jekyll processing
          touch dist/.nojekyll

          # Frontend (HTML/CSS/JS)
          cp -R frontend/* dist/

          # Shared static assets
          mkdir -p dist/assets
          cp -R assets/* dist/assets/

      - name: Configure Pages
        id: configure_pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Hint (enable Pages)
        if: steps.configure_pages.outcome != 'success'
        run: |
          echo "GitHub Pages is not enabled or Actions lacks permission to access it."
          echo "Enable it in: Settings -> Pages -> Source: GitHub Actions."
          echo "Also check: Settings -> Actions -> General -> Workflow permissions -> Read and write permissions."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4